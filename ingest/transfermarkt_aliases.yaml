# Transfermarkt club name -> canonical name (normalise/teams.yaml).
# Hand-built once against the raw names Transfermarkt's market-value pages
# returned for our 8 leagues (Aug 2026 pull). The automatic suffix-stripping
# normaliser (ingest/squad_value.py::_normalise_name) already handles plain
# "<Name> FC/CF/AFC/..." cases; this file is only the ones it can't - foreign
# club prefixes (AS/AC/SS/RC/...), full historical names, and spelling that
# diverges from football-data.co.uk's short form.
#
# Schalke 04 / Paderborn / Elversberg are listed even though they're not yet
# in normalise/teams.yaml (Bundesliga's 2026/27 file wasn't published when
# teams.yaml was last seeded, see ingest/historical.py's FileUnavailable
# handling) - harmless now, correct once that file appears and the alias
# resolver picks them up automatically.

