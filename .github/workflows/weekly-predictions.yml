name: Weekly predictions

# Thursday morning (after midweek team news) and Saturday morning (matchday)
# UTC. Also runnable on demand from the Actions tab for a manual refresh.
on:
  schedule:
    - cron: "0 8 * * 4"
    - cron: "0 7 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Render this weekend's predictions
        run: python -m scripts.render_coupon

      - name: Render the explainer, the angles and the track record
        run: |
          python -m scripts.render_why
          python -m scripts.render_angles
          python -m scripts.track_record --eval-start 2025-08-01

      - name: Commit updated pages and prediction log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/why.html docs/angles.html docs/track-record.html artefacts/prediction_log.csv
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Auto-update weekend pages [skip ci]"
          # The score-results workflow (or a manual push) can land on main while
          # this job runs; rebase our one commit onto it and retry rather than
          # failing the whole run.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) - syncing with origin/main"
            git pull --rebase --autostash origin main
          done
          git push
