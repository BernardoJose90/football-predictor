[pytest]
testpaths = tests
filterwarnings =
    # starlette 1.6 nudges toward an "httpx2" package that isn't the standard
    # client yet; fastapi.testclient still works fine on httpx. It's a
    # UserWarning subclass (StarletteDeprecationWarning), fired on import.
    ignore:Using .httpx. with .starlette.testclient.:UserWarning
